<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bëtking</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* Background images */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('https://ik.imagekit.io/v3c8xxz93/kin-mob.webp');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* Desktop background */
    @media (min-width: 768px) {
      .bg {
        background-image: url('https://ik.imagekit.io/v3c8xxz93/king-desk.webp');
      }
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.88) 0%,
        rgba(0, 0, 0, 0.32) 100%
      );
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Popup */
    .popup {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 340px;
      padding: 28px 24px 16px;
      text-align: left;
      position: relative;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.28),
                  0 2px 8px rgba(0, 0, 0, 0.12);
      animation: popIn 0.32s cubic-bezier(0.34, 1.46, 0.64, 1) both;
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #757575;
      transition: background 0.15s, color 0.15s;
    }

    .close-btn:hover {
      background: #f0f0f0;
      color: #333;
    }

    .close-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.82) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Header */
    .dialog-header {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 20px;
    }

    .pin-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
    }

    /* Title */
    .popup-title {
      font-size: 21px;
      font-weight: 400;
      color: #1a1a1a;
      line-height: 1.35;
    }

    .popup-title strong {
      font-weight: 700;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #1a73e8;
      letter-spacing: 0.2px;
      transition: background 0.15s;
    }

    .btn:hover {
      background: rgba(26, 115, 232, 0.08);
    }

    .btn:active {
      background: rgba(26, 115, 232, 0.16);
    }

    /* Mobile */
    @media (max-width: 380px) {
      .popup {
        padding: 22px 18px 14px;
        border-radius: 14px;
      }

      .popup-title {
        font-size: 19px;
      }

      .btn {
        font-size: 14px;
        padding: 9px 14px;
      }
    }

    @media (min-width: 768px) {
      .popup {
        max-width: 380px;
      }
    }
  </style>
</head>

<body>

  <!-- Responsive background -->
  <div class="bg"></div>

  <!-- Popup overlay -->
  <div class="overlay" id="overlay">

    <div class="popup" role="dialog"
         aria-modal="true"
         aria-labelledby="popup-title">

      <!-- Close button -->
      <button class="close-btn" onclick="goNo()" aria-label="Close">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5
                   5 6.41 10.59 12 5 17.59 6.41 19
                   12 13.41 17.59 19 19 17.59
                   13.41 12z"/>
        </svg>
      </button>

      <!-- Icon and title -->
      <div class="dialog-header">

        <svg class="pin-icon" viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13
               s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5
               c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5
               12 6.5s2.5 1.12 2.5 2.5S13.38
               11.5 12 11.5z"
            fill="#1a73e8"/>
        </svg>

        <p class="popup-title" id="popup-title">
          Allow <strong>Bëtking</strong> to access this device's location?
        </p>

      </div>

      <!-- Action buttons -->
      <div class="btn-row">
        <button class="btn" onclick="goNo()">Deny</button>
        <button class="btn" onclick="goYes()">Allow</button>
      </div>

    </div>
  </div>

  <script>
    var yes = '#';
    var no  = '#';

    function goYes() {
      window.location.href = yes;
    }

    function goNo() {
      window.location.href = no;
    }
  </script>

</body>
</html>
